name: Build Unsigned IPA

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    build-ipa:
        runs-on: macos-14
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Xcode (16+, 需要 objectVersion 77)
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest-stable'

            - name: Show toolchain
              run: |
                  xcodebuild -version
                  swift --version

            - name: Build (unsigned)
              run: |
                  set -eo pipefail
                  xcodebuild \
                    -project PakePlus.xcodeproj \
                    -scheme PakePlus \
                    -configuration Release \
                    -sdk iphoneos \
                    -destination 'generic/platform=iOS' \
                    -derivedDataPath "$RUNNER_TEMP/build" \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO \
                    build

            - name: Package IPA + 校验卡密页已编入
              run: |
                  set -eo pipefail
                  APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/PakePlus.app"
                  if [ ! -d "$APP" ]; then
                    echo "❌ 未找到构建产物: $APP"
                    exit 1
                  fi

                  BIN="$APP/PakePlus"
                  echo "=== 校验二进制是否包含卡密相关符号 ==="
                  # 先落盘再 grep：`strings ... | grep -q` 命中后 grep 立即退出，strings 会因 SIGPIPE
                  # 写不出数据而返回非 0，配合 `set -o pipefail` 会让整条管道被判定为失败（误报）。
                  STRINGS_DUMP="$RUNNER_TEMP/pakeplus.strings"
                  strings -a "$BIN" > "$STRINGS_DUMP"

                  check_symbol() {
                    if grep -q -- "$1" "$STRINGS_DUMP"; then
                      echo "✅ $1 已编入二进制"
                    elif [ "$2" = "required" ]; then
                      echo "❌ 二进制中没有 $1，说明相关代码没有被编译进去，请不要发布这个包"
                      exit 1
                    else
                      echo "⚠️ 二进制中没有 $1（非致命，仅提示）"
                    fi
                  }

                  check_symbol "CardKeyView" required
                  check_symbol "XbLicense" optional

                  echo "=== 校验 Info.plist 配置 ==="
                  /usr/libexec/PlistBuddy -c "Print :WEBURL" "$APP/Info.plist" || true
                  /usr/libexec/PlistBuddy -c "Print :DEBUG" "$APP/Info.plist" || true

                  mkdir -p Payload
                  cp -R "$APP" Payload/
                  rm -rf Payload/PakePlus.app/_CodeSignature
                  IPA="PakePlus-unsigned-${GITHUB_SHA::7}.ipa"
                  zip -qry "$IPA" Payload
                  ls -lh "$IPA"

            - name: Upload IPA Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PakePlus-ipa
                  path: PakePlus-unsigned-*.ipa
